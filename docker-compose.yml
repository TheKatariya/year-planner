services:
  year-planner:
    build: .
    container_name: year-planner
    restart: unless-stopped
    # Change the host side if 3005 clashes with something you run.
    ports:
      - "3005:3005"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    env_file:
      - .env
